 <g transform="translate(760 285)"><circle r="14" fill="#60a5fa" class="node"/><text text-anchor="middle" y="4" class="num">2</text><text x="0" y="31" text-anchor="middle" class="label">Tune Protect</text></g>
 <g transform="translate(620 165)"><circle r="14" fill="#f59e0b" class="node"/><text text-anchor="middle" y="4" class="num">3</text><text x="0" y="-25" text-anchor="middle" class="label">Museum VR</text></g>
 <g transform="translate(470 305)"><circle r="14" fill="#f472b6" class="node"/><text text-anchor="middle" y="4" class="num">4</text><text x="0" y="31" text-anchor="middle" class="label">Quest for Everyday Heroes</text></g>
 <g transform="translate(310 135)"><circle r="14" fill="#fb7185" class="node"/><text text-anchor="middle" y="4" class="num">5</text><text x="0" y="-25" text-anchor="middle" class="label">VR Offshore</text></g>
 <g transform="translate(110 265)"><circle r="16" fill="#34d399" class="node"/><text text-anchor="middle" y="4" class="num">6</text><text x="0" y="31" text-anchor="middle" class="label">SciLab VR · LATEST</text></g>
 <circle r="7" fill="#fff" class="traveler t2"><animateMotion dur="8s" begin="0s" repeatCount="indefinite" path="M890 120 L760 285 L620 165 L470 305 L310 135 L110 265"/></circle>
</g>

<g class="scene s3">
 <path class="route" d="M850 210 L720 105 L585 315 L430 175 L270 305 L135 155"/>
 <g transform="translate(850 210)"><circle r="14" fill="#a78bfa" class="node"/><text text-anchor="middle" y="4" class="num">1</text><text x="25" y="-20" class="label">Velocity Rush</text></g>
 <g transform="translate(720 105)"><circle r="14" fill="#60a5fa" class="node"/><text text-anchor="middle" y="4" class="num">2</text><text x="0" y="-25" text-anchor="middle" class="label">Tune Protect</text></g>
 <g transform="translate(585 315)"><circle r="14" fill="#f59e0b" class="node"/><text text-anchor="middle" y="4" class="num">3</text><text x="0" y="31" text-anchor="middle" class="label">Museum VR</text></g>
 <g transform="translate(430 175)"><circle r="14" fill="#f472b6" class="node"/><text text-anchor="middle" y="4" class="num">4</text><text x="0" y="-25" text-anchor="middle" class="label">Quest for Everyday Heroes</text></g>
 <g transform="translate(270 305)"><circle r="14" fill="#fb7185" class="node"/><text text-anchor="middle" y="4" class="num">5</text><text x="0" y="31" text-anchor="middle" class="label">VR Offshore</text></g>
 <g transform="translate(135 155)"><circle r="16" fill="#34d399" class="node"/><text text-anchor="middle" y="4" class="num">6</text><text x="0" y="-27" text-anchor="middle" class="label">SciLab VR · LATEST</text></g>
 <circle r="7" fill="#fff" class="traveler t3"><animateMotion dur="8s" begin="0s" repeatCount="indefinite" path="M850 210 L720 105 L585 315 L430 175 L270 305 L135 155"/></circle>
