<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc">
<title id="title">Project Journey — Grid Snake</title><desc id="desc">A three-box snake moves left to right through exact contribution-grid cells, collecting six illuminated project cells in order V T M Q O S.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="27" height="27" x="2.5" y="2.5" rx="4" fill="#161b22" stroke="#30363d"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.title{font:700 21px ui-monospace,Consolas,monospace;fill:#f0f6fc}.sub{font:12px ui-monospace,Consolas,monospace;fill:#8b949e}.letter{font:700 14px ui-monospace,Consolas,monospace;fill:#0d1117}.legend{font:600 11px ui-monospace,Consolas,monospace;fill:#c9d1d9}.food{stroke:#f0f6fc;stroke-width:1;filter:url(#glow)}.scene{opacity:0}.s1{animation:s1 30s linear infinite}.s2{animation:s2 30s linear infinite}.s3{animation:s3 30s linear infinite}@keyframes s1{0%,32.8%{opacity:1}33.3%,100%{opacity:0}}@keyframes s2{0%,33.2%{opacity:0}33.7%,66.1%{opacity:1}66.6%,100%{opacity:0}}@keyframes s3{0%,66.5%{opacity:0}67%,99.5%{opacity:1}100%{opacity:0}}.snake{fill:#a78bfa;filter:url(#glow)}.f1{animation:f1 10s linear infinite}.f2{animation:f2 10s linear infinite}.f3{animation:f3 10s linear infinite}.f4{animation:f4 10s linear infinite}.f5{animation:f5 10s linear infinite}.f6{animation:f6 10s linear infinite}@keyframes f1{0%,9%{opacity:1}9.5%,100%{opacity:0}}@keyframes f2{0%,25%{opacity:1}25.5%,100%{opacity:0}}@keyframes f3{0%,41%{opacity:1}41.5%,100%{opacity:0}}@keyframes f4{0%,57%{opacity:1}57.5%,100%{opacity:0}}@keyframes f5{0%,73%{opacity:1}73.5%,100%{opacity:0}}@keyframes f6{0%,89%{opacity:1}89.5%,100%{opacity:0}}.progress{animation:fill 10s linear infinite}@keyframes fill{0%,9%{width:0}9.5%,25%{width:142px}25.5%,41%{width:284px}41.5%,57%{width:426px}57.5%,73%{width:568px}73.5%,89%{width:710px}89.5%,98%,100%{width:852px}}</style>
</defs>
<rect width="1000" height="455" rx="18" fill="url(#bg)"/><text x="34" y="35" class="title">PROJECT JOURNEY // GRID RUN</text><text x="34" y="56" class="sub">oldest → latest · V → T → M → Q → O → S · LEFT → RIGHT</text>
<rect x="34" y="76" width="928" height="224" rx="12" fill="url(#grid)" stroke="#30363d"/>
<!-- Exact visible grid centers: x=50+32n, y=92+32n. Colored cells replace those exact board cells. -->
<g class="scene s1">
 <g class="f1" transform="translate(146 252)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#a78bfa" class="food"/><text y="5" text-anchor="middle" class="letter">V</text></g><g class="f2" transform="translate(306 92)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#60a5fa" class="food"/><text y="5" text-anchor="middle" class="letter">T</text></g><g class="f3" transform="translate(434 220)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f59e0b" class="food"/><text y="5" text-anchor="middle" class="letter">M</text></g><g class="f4" transform="translate(594 124)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f472b6" class="food"/><text y="5" text-anchor="middle" class="letter">Q</text></g><g class="f5" transform="translate(754 252)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#fb7185" class="food"/><text y="5" text-anchor="middle" class="letter">O</text></g><g class="f6" transform="translate(882 124)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#34d399" class="food"/><text y="5" text-anchor="middle" class="letter">S</text></g>
 <g><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" class="snake"/><animateMotion dur="10s" repeatCount="indefinite" path="M50 252H146V92H306V220H434V124H594V252H754V124H882V220H946"/></g><g opacity=".82"><rect x="-10" y="-10" width="20" height="20" rx="3" class="snake"/><animateMotion dur="10s" begin=".18s" repeatCount="indefinite" path="M50 252H146V92H306V220H434V124H594V252H754V124H882V220H946"/></g><g opacity=".62"><rect x="-7" y="-7" width="14" height="14" rx="2.5" class="snake"/><animateMotion dur="10s" begin=".36s" repeatCount="indefinite" path="M50 252H146V92H306V220H434V124H594V252H754V124H882V220H946"/></g>
</g>
<g class="scene s2">
 <g class="f1" transform="translate(114 124)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#a78bfa" class="food"/><text y="5" text-anchor="middle" class="letter">V</text></g><g class="f2" transform="translate(274 252)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#60a5fa" class="food"/><text y="5" text-anchor="middle" class="letter">T</text></g><g class="f3" transform="translate(434 92)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f59e0b" class="food"/><text y="5" text-anchor="middle" class="letter">M</text></g><g class="f4" transform="translate(562 220)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f472b6" class="food"/><text y="5" text-anchor="middle" class="letter">Q</text></g><g class="f5" transform="translate(722 92)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#fb7185" class="food"/><text y="5" text-anchor="middle" class="letter">O</text></g><g class="f6" transform="translate(914 252)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#34d399" class="food"/><text y="5" text-anchor="middle" class="letter">S</text></g>
 <g><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" class="snake"/><animateMotion dur="10s" repeatCount="indefinite" path="M50 124H114V252H274V92H434V220H562V92H722V252H914V188H946"/></g><g opacity=".82"><rect x="-10" y="-10" width="20" height="20" rx="3" class="snake"/><animateMotion dur="10s" begin=".18s" repeatCount="indefinite" path="M50 124H114V252H274V92H434V220H562V92H722V252H914V188H946"/></g><g opacity=".62"><rect x="-7" y="-7" width="14" height="14" rx="2.5" class="snake"/><animateMotion dur="10s" begin=".36s" repeatCount="indefinite" path="M50 124H114V252H274V92H434V220H562V92H722V252H914V188H946"/></g>
</g>
<g class="scene s3">
 <g class="f1" transform="translate(146 92)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#a78bfa" class="food"/><text y="5" text-anchor="middle" class="letter">V</text></g><g class="f2" transform="translate(274 188)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#60a5fa" class="food"/><text y="5" text-anchor="middle" class="letter">T</text></g><g class="f3" transform="translate(466 252)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f59e0b" class="food"/><text y="5" text-anchor="middle" class="letter">M</text></g><g class="f4" transform="translate(594 92)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f472b6" class="food"/><text y="5" text-anchor="middle" class="letter">Q</text></g><g class="f5" transform="translate(754 188)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#fb7185" class="food"/><text y="5" text-anchor="middle" class="letter">O</text></g><g class="f6" transform="translate(882 252)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#34d399" class="food"/><text y="5" text-anchor="middle" class="letter">S</text></g>
 <g><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" class="snake"/><animateMotion dur="10s" repeatCount="indefinite" path="M50 92H146V188H274V252H466V92H594V188H754V252H882V156H946"/></g><g opacity=".82"><rect x="-10" y="-10" width="20" height="20" rx="3" class="snake"/><animateMotion dur="10s" begin=".18s" repeatCount="indefinite" path="M50 92H146V188H274V252H466V92H594V188H754V252H882V156H946"/></g><g opacity=".62"><rect x="-7" y="-7" width="14" height="14" rx="2.5" class="snake"/><animateMotion dur="10s" begin=".36s" repeatCount="indefinite" path="M50 92H146V188H274V252H466V92H594V188H754V252H882V156H946"/></g>
</g>
<text x="34" y="324" class="sub">PROJECTS COLLECTED</text><rect x="34" y="334" width="852" height="9" rx="4.5" fill="#21262d"/><rect x="34" y="334" width="0" height="9" rx="4.5" fill="#34d399" class="progress"/><text x="902" y="343" class="sub">0/6 → 6/6</text>
<rect x="34" y="363" width="928" height="65" rx="10" fill="#0d1117" stroke="#30363d"/><text x="50" y="383" class="sub">LEGEND / PROJECT KEY</text><g transform="translate(50 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#a78bfa"/><text x="9" y="3" text-anchor="middle" class="letter">V</text><text x="25" y="3" class="legend">Velocity Rush</text></g><g transform="translate(190 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#60a5fa"/><text x="9" y="3" text-anchor="middle" class="letter">T</text><text x="25" y="3" class="legend">Tune Protect</text></g><g transform="translate(330 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#f59e0b"/><text x="9" y="3" text-anchor="middle" class="letter">M</text><text x="25" y="3" class="legend">Museum VR</text></g><g transform="translate(465 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#f472b6"/><text x="9" y="3" text-anchor="middle" class="letter">Q</text><text x="25" y="3" class="legend">Quest</text></g><g transform="translate(585 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#fb7185"/><text x="9" y="3" text-anchor="middle" class="letter">O</text><text x="25" y="3" class="legend">VR Offshore</text></g><g transform="translate(735 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#34d399"/><text x="9" y="3" text-anchor="middle" class="letter">S</text><text x="25" y="3" class="legend">SciLab VR · Latest</text></g>
</svg>