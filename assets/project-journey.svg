<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Mohammad Tahmidul Hasan — Project Journey</title>
<desc id="desc">A snake travels from right to left through six dynamically positioned project milestones, oldest to latest.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <linearGradient id="route" x1="1" y1="0" x2="0" y2="0"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#30363d" opacity=".42"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .title{font:700 22px ui-monospace,Consolas,monospace;fill:#f0f6fc}.sub{font:13px ui-monospace,Consolas,monospace;fill:#8b949e}.label{font:600 12px ui-monospace,Consolas,monospace;fill:#e6edf3}.num{font:700 11px ui-monospace,Consolas,monospace;fill:#0d1117}.route{fill:none;stroke:url(#route);stroke-width:3;stroke-linecap:round;stroke-dasharray:8 9;filter:url(#glow)}.node{stroke:#0d1117;stroke-width:4;filter:url(#glow)}.scene{opacity:0}.s1{animation:a 24s linear infinite}.s2{animation:b 24s linear infinite}.s3{animation:c 24s linear infinite}@keyframes a{0%,31%{opacity:1}33%,100%{opacity:0}}@keyframes b{0%,32%{opacity:0}34%,64%{opacity:1}66%,100%{opacity:0}}@keyframes c{0%,65%{opacity:0}67%,98%{opacity:1}100%{opacity:0}}.snake{filter:url(#glow)}
 </style>
</defs>
<rect width="1000" height="390" rx="18" fill="url(#bg)"/><rect x="18" y="76" width="964" height="286" rx="14" fill="url(#grid)" stroke="#30363d"/>
<text x="38" y="39" class="title">PROJECT JOURNEY // IMMERSIVE SYSTEMS</text><text x="38" y="62" class="sub">development chronology · dynamic positions · RIGHT → LEFT · oldest → latest</text><text x="962" y="48" text-anchor="end" class="sub">UNITY · XR · SIMULATION · AI</text>

<!-- Each scene deliberately starts at the rightmost old project and finishes at the leftmost latest project. -->
<g class="scene s1">
 <path class="route" d="M865 305L735 150L600 278L455 125L285 250L125 118"/>
 <g transform="translate(865 305)"><circle r="14" fill="#a78bfa" class="node"/><text y="4" text-anchor="middle" class="num">1</text><text x="-8" y="-25" text-anchor="end" class="label">Velocity Rush</text></g>
 <g transform="translate(735 150)"><circle r="14" fill="#60a5fa" class="node"/><text y="4" text-anchor="middle" class="num">2</text><text y="-25" text-anchor="middle" class="label">Tune Protect</text></g>
 <g transform="translate(600 278)"><circle r="14" fill="#f59e0b" class="node"/><text y="4" text-anchor="middle" class="num">3</text><text y="31" text-anchor="middle" class="label">Museum VR</text></g>
 <g transform="translate(455 125)"><circle r="14" fill="#f472b6" class="node"/><text y="4" text-anchor="middle" class="num">4</text><text y="-25" text-anchor="middle" class="label">Quest for Everyday Heroes</text></g>
 <g transform="translate(285 250)"><circle r="14" fill="#fb7185" class="node"/><text y="4" text-anchor="middle" class="num">5</text><text y="31" text-anchor="middle" class="label">VR Offshore</text></g>
 <g transform="translate(125 118)"><circle r="16" fill="#34d399" class="node"/><text y="4" text-anchor="middle" class="num">6</text><text y="-27" text-anchor="middle" class="label">SciLab VR · LATEST</text></g>
 <g class="snake"><path d="M-42 0C-32-14-22 14-12 0S8-14 18 0" fill="none" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/><circle cx="22" r="9" fill="#f0f6fc"/><circle cx="25" cy="-3" r="2" fill="#0d1117"/><path d="M31 1l9 4-9 2" fill="none" stroke="#fb7185" stroke-width="2"/><animateMotion dur="8s" repeatCount="indefinite" rotate="auto" path="M865 305L735 150L600 278L455 125L285 250L125 118"/></g>
</g>
<g class="scene s2">
 <path class="route" d="M890 120L760 285L620 165L470 305L310 135L110 265"/>
 <g transform="translate(890 120)"><circle r="14" fill="#a78bfa" class="node"/><text y="4" text-anchor="middle" class="num">1</text><text x="-25" y="-20" text-anchor="end" class="label">Velocity Rush</text></g><g transform="translate(760 285)"><circle r="14" fill="#60a5fa" class="node"/><text y="4" text-anchor="middle" class="num">2</text><text y="31" text-anchor="middle" class="label">Tune Protect</text></g><g transform="translate(620 165)"><circle r="14" fill="#f59e0b" class="node"/><text y="4" text-anchor="middle" class="num">3</text><text y="-25" text-anchor="middle" class="label">Museum VR</text></g><g transform="translate(470 305)"><circle r="14" fill="#f472b6" class="node"/><text y="4" text-anchor="middle" class="num">4</text><text y="31" text-anchor="middle" class="label">Quest for Everyday Heroes</text></g><g transform="translate(310 135)"><circle r="14" fill="#fb7185" class="node"/><text y="4" text-anchor="middle" class="num">5</text><text y="-25" text-anchor="middle" class="label">VR Offshore</text></g><g transform="translate(110 265)"><circle r="16" fill="#34d399" class="node"/><text y="4" text-anchor="middle" class="num">6</text><text y="31" text-anchor="middle" class="label">SciLab VR · LATEST</text></g>
 <g class="snake"><path d="M-42 0C-32-14-22 14-12 0S8-14 18 0" fill="none" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/><circle cx="22" r="9" fill="#f0f6fc"/><circle cx="25" cy="-3" r="2" fill="#0d1117"/><path d="M31 1l9 4-9 2" fill="none" stroke="#fb7185" stroke-width="2"/><animateMotion dur="8s" repeatCount="indefinite" rotate="auto" path="M890 120L760 285L620 165L470 305L310 135L110 265"/></g>
</g>
<g class="scene s3">
 <path class="route" d="M850 210L720 105L585 315L430 175L270 305L135 155"/>
 <g transform="translate(850 210)"><circle r="14" fill="#a78bfa" class="node"/><text y="4" text-anchor="middle" class="num">1</text><text x="25" y="-20" class="label">Velocity Rush</text></g><g transform="translate(720 105)"><circle r="14" fill="#60a5fa" class="node"/><text y="4" text-anchor="middle" class="num">2</text><text y="-25" text-anchor="middle" class="label">Tune Protect</text></g><g transform="translate(585 315)"><circle r="14" fill="#f59e0b" class="node"/><text y="4" text-anchor="middle" class="num">3</text><text y="31" text-anchor="middle" class="label">Museum VR</text></g><g transform="translate(430 175)"><circle r="14" fill="#f472b6" class="node"/><text y="4" text-anchor="middle" class="num">4</text><text y="-25" text-anchor="middle" class="label">Quest for Everyday Heroes</text></g><g transform="translate(270 305)"><circle r="14" fill="#fb7185" class="node"/><text y="4" text-anchor="middle" class="num">5</text><text y="31" text-anchor="middle" class="label">VR Offshore</text></g><g transform="translate(135 155)"><circle r="16" fill="#34d399" class="node"/><text y="4" text-anchor="middle" class="num">6</text><text y="-27" text-anchor="middle" class="label">SciLab VR · LATEST</text></g>
 <g class="snake"><path d="M-42 0C-32-14-22 14-12 0S8-14 18 0" fill="none" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/><circle cx="22" r="9" fill="#f0f6fc"/><circle cx="25" cy="-3" r="2" fill="#0d1117"/><path d="M31 1l9 4-9 2" fill="none" stroke="#fb7185" stroke-width="2"/><animateMotion dur="8s" repeatCount="indefinite" rotate="auto" path="M850 210L720 105L585 315L430 175L270 305L135 155"/></g>
</g>
<text x="962" y="380" text-anchor="end" class="sub">01 Velocity Rush  ←  02 Tune Protect  ←  03 Museum  ←  04 Quest  ←  05 Offshore  ←  06 SciLab VR</text>
</svg>