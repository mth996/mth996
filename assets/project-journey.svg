<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc">
<title id="title">Project Journey — Snake Collection</title><desc id="desc">A three-dot snake moves left to right through a contribution-style grid, collecting V T M Q O S. Each differently colored project tile disappears when collected and the progress bar fills to six of six.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="27" height="27" x="2.5" y="2.5" rx="4" fill="#161b22" stroke="#30363d"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .title{font:700 21px ui-monospace,Consolas,monospace;fill:#f0f6fc}.sub{font:12px ui-monospace,Consolas,monospace;fill:#8b949e}.letter{font:700 14px ui-monospace,Consolas,monospace;fill:#0d1117}.legend{font:600 11px ui-monospace,Consolas,monospace;fill:#c9d1d9}.cell{stroke:#f0f6fc;stroke-width:1.3;filter:url(#glow)}.scene{opacity:0}.s1{animation:scene1 30s linear infinite}.s2{animation:scene2 30s linear infinite}.s3{animation:scene3 30s linear infinite}@keyframes scene1{0%,31%{opacity:1}33%,100%{opacity:0}}@keyframes scene2{0%,32%{opacity:0}34%,64%{opacity:1}66%,100%{opacity:0}}@keyframes scene3{0%,65%{opacity:0}67%,98%{opacity:1}100%{opacity:0}}.target{animation:vanish 10s linear infinite}@keyframes vanish{0%,15%{opacity:1}17%,100%{opacity:0}}.t2{animation-delay:1.25s}.t3{animation-delay:2.75s}.t4{animation-delay:4.25s}.t5{animation-delay:5.8s}.t6{animation-delay:7.3s}.head,.mid,.tail{filter:url(#glow)}.progress{animation:fill 10s steps(6,end) infinite}@keyframes fill{0%{width:0}16%{width:142px}32%{width:284px}48%{width:426px}64%{width:568px}80%{width:710px}96%,100%{width:852px}}.count{font:700 11px ui-monospace,Consolas,monospace;fill:#f0f6fc}.c0,.c1,.c2,.c3,.c4,.c5,.c6{animation:count 10s linear infinite;opacity:0}@keyframes count{0%,15%{opacity:1}16%,100%{opacity:0}}.c1{animation-delay:1.6s}.c2{animation-delay:3.2s}.c3{animation-delay:4.8s}.c4{animation-delay:6.4s}.c5{animation-delay:8s}.c6{animation-delay:9.6s}
 </style>
</defs>
<rect width="1000" height="455" rx="18" fill="url(#bg)"/><text x="34" y="35" class="title">PROJECT JOURNEY // SNAKE RUN</text><text x="34" y="56" class="sub">oldest → latest · V → T → M → Q → O → S · LEFT → RIGHT</text>
<rect x="34" y="76" width="928" height="224" rx="12" fill="url(#grid)" stroke="#30363d"/>

<!-- Three predetermined scattered layouts rotate every ten seconds. No route is drawn. -->
<g class="scene s1">
 <g class="target"><g transform="translate(146 264)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#a78bfa" class="cell"/><text y="5" text-anchor="middle" class="letter">V</text></g></g>
 <g class="target t2"><g transform="translate(306 104)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#60a5fa" class="cell"/><text y="5" text-anchor="middle" class="letter">T</text></g></g>
 <g class="target t3"><g transform="translate(434 232)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f59e0b" class="cell"/><text y="5" text-anchor="middle" class="letter">M</text></g></g>
 <g class="target t4"><g transform="translate(594 136)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f472b6" class="cell"/><text y="5" text-anchor="middle" class="letter">Q</text></g></g>
 <g class="target t5"><g transform="translate(754 264)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#fb7185" class="cell"/><text y="5" text-anchor="middle" class="letter">O</text></g></g>
 <g class="target t6"><g transform="translate(882 136)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#34d399" class="cell"/><text y="5" text-anchor="middle" class="letter">S</text></g></g>
</g>
<g class="scene s2">
 <g class="target"><g transform="translate(114 136)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#a78bfa" class="cell"/><text y="5" text-anchor="middle" class="letter">V</text></g></g><g class="target t2"><g transform="translate(274 264)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#60a5fa" class="cell"/><text y="5" text-anchor="middle" class="letter">T</text></g></g><g class="target t3"><g transform="translate(434 104)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f59e0b" class="cell"/><text y="5" text-anchor="middle" class="letter">M</text></g></g><g class="target t4"><g transform="translate(562 232)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f472b6" class="cell"/><text y="5" text-anchor="middle" class="letter">Q</text></g></g><g class="target t5"><g transform="translate(722 104)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#fb7185" class="cell"/><text y="5" text-anchor="middle" class="letter">O</text></g></g><g class="target t6"><g transform="translate(914 264)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#34d399" class="cell"/><text y="5" text-anchor="middle" class="letter">S</text></g></g>
</g>
<g class="scene s3">
 <g class="target"><g transform="translate(146 104)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#a78bfa" class="cell"/><text y="5" text-anchor="middle" class="letter">V</text></g></g><g class="target t2"><g transform="translate(274 200)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#60a5fa" class="cell"/><text y="5" text-anchor="middle" class="letter">T</text></g></g><g class="target t3"><g transform="translate(466 264)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f59e0b" class="cell"/><text y="5" text-anchor="middle" class="letter">M</text></g></g><g class="target t4"><g transform="translate(594 104)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f472b6" class="cell"/><text y="5" text-anchor="middle" class="letter">Q</text></g></g><g class="target t5"><g transform="translate(754 200)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#fb7185" class="cell"/><text y="5" text-anchor="middle" class="letter">O</text></g></g><g class="target t6"><g transform="translate(882 264)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#34d399" class="cell"/><text y="5" text-anchor="middle" class="letter">S</text></g></g>
</g>

<!-- Three-dot tapered snake. Hidden orthogonal motion paths; no route is rendered. -->
<g class="head"><circle r="11" fill="#f0f6fc"/><circle cx="4" cy="-3" r="2" fill="#0d1117"/><animateMotion dur="10s" repeatCount="indefinite" rotate="auto" path="M50 264H146V104H306V232H434V136H594V264H754V136H882V232H946"/></g>
<g class="mid" opacity=".82"><circle r="8" fill="#c9d1d9"/><animateMotion dur="10s" begin="-.22s" repeatCount="indefinite" rotate="auto" path="M50 264H146V104H306V232H434V136H594V264H754V136H882V232H946"/></g>
<g class="tail" opacity=".62"><circle r="5.5" fill="#8b949e"/><animateMotion dur="10s" begin="-.44s" repeatCount="indefinite" rotate="auto" path="M50 264H146V104H306V232H434V136H594V264H754V136H882V232H946"/></g>

<!-- Collection progress -->
<text x="34" y="324" class="sub">PROJECTS COLLECTED</text><rect x="34" y="334" width="852" height="9" rx="4.5" fill="#21262d"/><rect x="34" y="334" width="0" height="9" rx="4.5" fill="#34d399" class="progress"/><text x="902" y="343" class="count">0/6 → 6/6</text>

<!-- Fixed legend -->
<rect x="34" y="363" width="928" height="65" rx="10" fill="#0d1117" stroke="#30363d"/><text x="50" y="383" class="sub">LEGEND / PROJECT KEY</text>
<g transform="translate(50 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#a78bfa"/><text x="9" y="3" text-anchor="middle" class="letter">V</text><text x="25" y="3" class="legend">Velocity Rush</text></g><g transform="translate(190 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#60a5fa"/><text x="9" y="3" text-anchor="middle" class="letter">T</text><text x="25" y="3" class="legend">Tune Protect</text></g><g transform="translate(330 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#f59e0b"/><text x="9" y="3" text-anchor="middle" class="letter">M</text><text x="25" y="3" class="legend">Museum VR</text></g><g transform="translate(465 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#f472b6"/><text x="9" y="3" text-anchor="middle" class="letter">Q</text><text x="25" y="3" class="legend">Quest</text></g><g transform="translate(585 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#fb7185"/><text x="9" y="3" text-anchor="middle" class="letter">O</text><text x="25" y="3" class="legend">VR Offshore</text></g><g transform="translate(735 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#34d399"/><text x="9" y="3" text-anchor="middle" class="letter">S</text><text x="25" y="3" class="legend">SciLab VR · Latest</text></g>
</svg>