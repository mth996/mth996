<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc">
<title id="title">Project Journey — Cell Grid Run</title><desc id="desc">A left-to-right three-cell snake travels through a board made from individual contribution cells and collects six project cells V T M Q O S.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <rect id="cell" width="27" height="27" rx="4" fill="#161b22" stroke="#30363d"/>
 <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.title{font:700 21px ui-monospace,Consolas,monospace;fill:#f0f6fc}.sub{font:12px ui-monospace,Consolas,monospace;fill:#8b949e}.letter{font:700 14px ui-monospace,Consolas,monospace;fill:#0d1117}.legend{font:600 11px ui-monospace,Consolas,monospace;fill:#c9d1d9}.state{stroke:#30363d;stroke-width:1;filter:url(#glow)}.scene{opacity:0}.s1{animation:s1 30s linear infinite}.s2{animation:s2 30s linear infinite}.s3{animation:s3 30s linear infinite}@keyframes s1{0%,32.8%{opacity:1}33.3%,100%{opacity:0}}@keyframes s2{0%,33.2%{opacity:0}33.7%,66.1%{opacity:1}66.6%,100%{opacity:0}}@keyframes s3{0%,66.5%{opacity:0}67%,99.5%{opacity:1}100%{opacity:0}}.snake{fill:#a78bfa;stroke:#30363d;stroke-width:1}.f1{animation:f1 10s linear infinite}.f2{animation:f2 10s linear infinite}.f3{animation:f3 10s linear infinite}.f4{animation:f4 10s linear infinite}.f5{animation:f5 10s linear infinite}.f6{animation:f6 10s linear infinite}@keyframes f1{0%,9%{opacity:1}9.5%,100%{opacity:0}}@keyframes f2{0%,25%{opacity:1}25.5%,100%{opacity:0}}@keyframes f3{0%,41%{opacity:1}41.5%,100%{opacity:0}}@keyframes f4{0%,57%{opacity:1}57.5%,100%{opacity:0}}@keyframes f5{0%,73%{opacity:1}73.5%,100%{opacity:0}}@keyframes f6{0%,89%{opacity:1}89.5%,100%{opacity:0}}.progress{animation:fill 10s linear infinite}@keyframes fill{0%,9%{width:0}9.5%,25%{width:142px}25.5%,41%{width:284px}41.5%,57%{width:426px}57.5%,73%{width:568px}73.5%,89%{width:710px}89.5%,100%{width:852px}}</style>
</defs>
<rect width="1000" height="455" rx="18" fill="url(#bg)"/><text x="34" y="35" class="title">PROJECT JOURNEY // GRID RUN</text><text x="34" y="56" class="sub">oldest → latest · V → T → M → Q → O → S · LEFT → RIGHT</text>
<rect x="34" y="76" width="928" height="224" rx="12" fill="#0d1117" stroke="#30363d"/>
<!-- The board is composed of real cells, not a background pattern. -->
<g id="board">
<g transform="translate(36 78)">
<!-- 29 columns × 7 rows -->
<g id="row"><use href="#cell" x="0"/><use href="#cell" x="32"/><use href="#cell" x="64"/><use href="#cell" x="96"/><use href="#cell" x="128"/><use href="#cell" x="160"/><use href="#cell" x="192"/><use href="#cell" x="224"/><use href="#cell" x="256"/><use href="#cell" x="288"/><use href="#cell" x="320"/><use href="#cell" x="352"/><use href="#cell" x="384"/><use href="#cell" x="416"/><use href="#cell" x="448"/><use href="#cell" x="480"/><use href="#cell" x="512"/><use href="#cell" x="544"/><use href="#cell" x="576"/><use href="#cell" x="608"/><use href="#cell" x="640"/><use href="#cell" x="672"/><use href="#cell" x="704"/><use href="#cell" x="736"/><use href="#cell" x="768"/><use href="#cell" x="800"/><use href="#cell" x="832"/><use href="#cell" x="864"/><use href="#cell" x="896"/></g>
<use href="#row" y="0"/><use href="#row" y="32"/><use href="#row" y="64"/><use href="#row" y="96"/><use href="#row" y="128"/><use href="#row" y="160"/><use href="#row" y="192"/>
</g></g>
<!-- Each state rect is exactly 27×27 at the same top-left positions as board cells. -->
<g class="scene s1">
 <g class="f1"><rect x="132" y="238" width="27" height="27" rx="4" fill="#a78bfa" class="state"/><text x="145.5" y="256.5" text-anchor="middle" class="letter">V</text></g><g class="f2"><rect x="292" y="78" width="27" height="27" rx="4" fill="#60a5fa" class="state"/><text x="305.5" y="96.5" text-anchor="middle" class="letter">T</text></g><g class="f3"><rect x="420" y="206" width="27" height="27" rx="4" fill="#f59e0b" class="state"/><text x="433.5" y="224.5" text-anchor="middle" class="letter">M</text></g><g class="f4"><rect x="580" y="110" width="27" height="27" rx="4" fill="#f472b6" class="state"/><text x="593.5" y="128.5" text-anchor="middle" class="letter">Q</text></g><g class="f5"><rect x="740" y="238" width="27" height="27" rx="4" fill="#fb7185" class="state"/><text x="753.5" y="256.5" text-anchor="middle" class="letter">O</text></g><g class="f6"><rect x="868" y="110" width="27" height="27" rx="4" fill="#34d399" class="state"/><text x="881.5" y="128.5" text-anchor="middle" class="letter">S</text></g>
 <g><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" class="snake"/><animateMotion dur="10s" repeatCount="indefinite" path="M49.5 251.5H145.5V91.5H305.5V219.5H433.5V123.5H593.5V251.5H753.5V123.5H881.5V219.5H945.5"/></g><g opacity=".82"><rect x="-10" y="-10" width="20" height="20" rx="3" fill="#a78bfa"/><animateMotion dur="10s" begin=".18s" repeatCount="indefinite" path="M49.5 251.5H145.5V91.5H305.5V219.5H433.5V123.5H593.5V251.5H753.5V123.5H881.5V219.5H945.5"/></g><g opacity=".62"><rect x="-7" y="-7" width="14" height="14" rx="2.5" fill="#a78bfa"/><animateMotion dur="10s" begin=".36s" repeatCount="indefinite" path="M49.5 251.5H145.5V91.5H305.5V219.5H433.5V123.5H593.5V251.5H753.5V123.5H881.5V219.5H945.5"/></g>
</g>
<g class="scene s2">
 <g class="f1"><rect x="100" y="110" width="27" height="27" rx="4" fill="#a78bfa" class="state"/><text x="113.5" y="128.5" text-anchor="middle" class="letter">V</text></g><g class="f2"><rect x="260" y="238" width="27" height="27" rx="4" fill="#60a5fa" class="state"/><text x="273.5" y="256.5" text-anchor="middle" class="letter">T</text></g><g class="f3"><rect x="420" y="78" width="27" height="27" rx="4" fill="#f59e0b" class="state"/><text x="433.5" y="96.5" text-anchor="middle" class="letter">M</text></g><g class="f4"><rect x="548" y="206" width="27" height="27" rx="4" fill="#f472b6" class="state"/><text x="561.5" y="224.5" text-anchor="middle" class="letter">Q</text></g><g class="f5"><rect x="708" y="78" width="27" height="27" rx="4" fill="#fb7185" class="state"/><text x="721.5" y="96.5" text-anchor="middle" class="letter">O</text></g><g class="f6"><rect x="900" y="238" width="27" height="27" rx="4" fill="#34d399" class="state"/><text x="913.5" y="256.5" text-anchor="middle" class="letter">S</text></g>
 <g><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" class="snake"/><animateMotion dur="10s" repeatCount="indefinite" path="M49.5 123.5H113.5V251.5H273.5V91.5H433.5V219.5H561.5V91.5H721.5V251.5H913.5V187.5H945.5"/></g><g opacity=".82"><rect x="-10" y="-10" width="20" height="20" rx="3" fill="#a78bfa"/><animateMotion dur="10s" begin=".18s" repeatCount="indefinite" path="M49.5 123.5H113.5V251.5H273.5V91.5H433.5V219.5H561.5V91.5H721.5V251.5H913.5V187.5H945.5"/></g><g opacity=".62"><rect x="-7" y="-7" width="14" height="14" rx="2.5" fill="#a78bfa"/><animateMotion dur="10s" begin=".36s" repeatCount="indefinite" path="M49.5 123.5H113.5V251.5H273.5V91.5H433.5V219.5H561.5V91.5H721.5V251.5H913.5V187.5H945.5"/></g>
</g>
<g class="scene s3">
 <g class="f1"><rect x="132" y="78" width="27" height="27" rx="4" fill="#a78bfa" class="state"/><text x="145.5" y="96.5" text-anchor="middle" class="letter">V</text></g><g class="f2"><rect x="260" y="174" width="27" height="27" rx="4" fill="#60a5fa" class="state"/><text x="273.5" y="192.5" text-anchor="middle" class="letter">T</text></g><g class="f3"><rect x="452" y="238" width="27" height="27" rx="4" fill="#f59e0b" class="state"/><text x="465.5" y="256.5" text-anchor="middle" class="letter">M</text></g><g class="f4"><rect x="580" y="78" width="27" height="27" rx="4" fill="#f472b6" class="state"/><text x="593.5" y="96.5" text-anchor="middle" class="letter">Q</text></g><g class="f5"><rect x="740" y="174" width="27" height="27" rx="4" fill="#fb7185" class="state"/><text x="753.5" y="192.5" text-anchor="middle" class="letter">O</text></g><g class="f6"><rect x="868" y="238" width="27" height="27" rx="4" fill="#34d399" class="state"/><text x="881.5" y="256.5" text-anchor="middle" class="letter">S</text></g>
 <g><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" class="snake"/><animateMotion dur="10s" repeatCount="indefinite" path="M49.5 91.5H145.5V187.5H273.5V251.5H465.5V91.5H593.5V187.5H753.5V251.5H881.5V155.5H945.5"/></g><g opacity=".82"><rect x="-10" y="-10" width="20" height="20" rx="3" fill="#a78bfa"/><animateMotion dur="10s" begin=".18s" repeatCount="indefinite" path="M49.5 91.5H145.5V187.5H273.5V251.5H465.5V91.5H593.5V187.5H753.5V251.5H881.5V155.5H945.5"/></g><g opacity=".62"><rect x="-7" y="-7" width="14" height="14" rx="2.5" fill="#a78bfa"/><animateMotion dur="10s" begin=".36s" repeatCount="indefinite" path="M49.5 91.5H145.5V187.5H273.5V251.5H465.5V91.5H593.5V187.5H753.5V251.5H881.5V155.5H945.5"/></g>
</g>
<text x="34" y="324" class="sub">PROJECTS COLLECTED</text><rect x="34" y="334" width="852" height="9" rx="4.5" fill="#21262d"/><rect x="34" y="334" width="0" height="9" rx="4.5" fill="#34d399" class="progress"/>
<rect x="34" y="363" width="928" height="65" rx="10" fill="#0d1117" stroke="#30363d"/><text x="50" y="383" class="sub">LEGEND / PROJECT KEY</text><g transform="translate(50 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#a78bfa"/><text x="9" y="3" text-anchor="middle" class="letter">V</text><text x="25" y="3" class="legend">Velocity Rush</text></g><g transform="translate(190 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#60a5fa"/><text x="9" y="3" text-anchor="middle" class="letter">T</text><text x="25" y="3" class="legend">Tune Protect</text></g><g transform="translate(330 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#f59e0b"/><text x="9" y="3" text-anchor="middle" class="letter">M</text><text x="25" y="3" class="legend">Museum VR</text></g><g transform="translate(465 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#f472b6"/><text x="9" y="3" text-anchor="middle" class="letter">Q</text><text x="25" y="3" class="legend">Quest</text></g><g transform="translate(585 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#fb7185"/><text x="9" y="3" text-anchor="middle" class="letter">O</text><text x="25" y="3" class="legend">VR Offshore</text></g><g transform="translate(735 405)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#34d399"/><text x="9" y="3" text-anchor="middle" class="letter">S</text><text x="25" y="3" class="legend">SciLab VR · Latest</text></g>
</svg>