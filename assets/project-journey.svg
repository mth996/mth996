<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Project Journey — Grid Snake</title><desc id="desc">A grid snake travels right to left collecting six colored project cells in chronological order V T M Q O S. Layout changes each cycle.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="27" height="27" x="2.5" y="2.5" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .title{font:700 21px ui-monospace,Consolas,monospace;fill:#f0f6fc}.sub{font:12px ui-monospace,Consolas,monospace;fill:#8b949e}.letter{font:700 14px ui-monospace,Consolas,monospace;fill:#0d1117}.legend{font:600 11px ui-monospace,Consolas,monospace;fill:#c9d1d9}.cell{stroke:#f0f6fc;stroke-width:1.5;filter:url(#glow)}.scene{opacity:0}.s1{animation:s1 27s linear infinite}.s2{animation:s2 27s linear infinite}.s3{animation:s3 27s linear infinite}@keyframes s1{0%,31%{opacity:1}33%,100%{opacity:0}}@keyframes s2{0%,32%{opacity:0}34%,64%{opacity:1}66%,100%{opacity:0}}@keyframes s3{0%,65%{opacity:0}67%,98%{opacity:1}100%{opacity:0}}.trail{fill:none;stroke:#58a6ff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.32}.snakeBody{fill:none;stroke:#f0f6fc;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
 </style>
</defs>
<rect width="1000" height="430" rx="18" fill="url(#bg)"/><text x="34" y="35" class="title">PROJECT JOURNEY // GRID RUN</text><text x="34" y="56" class="sub">oldest → latest · snake collects V → T → M → Q → O → S · overall direction RIGHT → LEFT</text>
<rect x="34" y="76" width="928" height="256" rx="12" fill="url(#grid)" stroke="#30363d"/>

<!-- Scene 1: all milestone centers sit on 32px grid centers -->
<g class="scene s1">
 <path class="trail" d="M914 296H850V104H754V232H658V136H562V296H466V168H370V264H274V104H178V200H82"/>
 <g transform="translate(850 296)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#a78bfa" class="cell"/><text y="5" text-anchor="middle" class="letter">V</text></g>
 <g transform="translate(754 232)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#60a5fa" class="cell"/><text y="5" text-anchor="middle" class="letter">T</text></g>
 <g transform="translate(658 136)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f59e0b" class="cell"/><text y="5" text-anchor="middle" class="letter">M</text></g>
 <g transform="translate(466 168)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f472b6" class="cell"/><text y="5" text-anchor="middle" class="letter">Q</text></g>
 <g transform="translate(274 104)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#fb7185" class="cell"/><text y="5" text-anchor="middle" class="letter">O</text></g>
 <g transform="translate(178 200)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#34d399" class="cell"/><text y="5" text-anchor="middle" class="letter">S</text></g>
 <g><path d="M-36 0H8" class="snakeBody"/><rect x="8" y="-9" width="18" height="18" rx="5" fill="#f0f6fc"/><circle cx="20" cy="-3" r="2" fill="#0d1117"/><animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M914 296H850V104H754V232H658V136H562V296H466V168H370V264H274V104H178V200H82"/></g>
</g>

<!-- Scene 2: reshuffled cells, same collection order -->
<g class="scene s2">
 <path class="trail" d="M914 136H882V264H786V104H690V296H594V200H498V104H402V232H306V136H210V296H114V168H82"/>
 <g transform="translate(882 264)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#a78bfa" class="cell"/><text y="5" text-anchor="middle" class="letter">V</text></g><g transform="translate(786 104)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#60a5fa" class="cell"/><text y="5" text-anchor="middle" class="letter">T</text></g><g transform="translate(690 296)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f59e0b" class="cell"/><text y="5" text-anchor="middle" class="letter">M</text></g><g transform="translate(498 104)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f472b6" class="cell"/><text y="5" text-anchor="middle" class="letter">Q</text></g><g transform="translate(306 136)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#fb7185" class="cell"/><text y="5" text-anchor="middle" class="letter">O</text></g><g transform="translate(114 168)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#34d399" class="cell"/><text y="5" text-anchor="middle" class="letter">S</text></g>
 <g><path d="M-36 0H8" class="snakeBody"/><rect x="8" y="-9" width="18" height="18" rx="5" fill="#f0f6fc"/><circle cx="20" cy="-3" r="2" fill="#0d1117"/><animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M914 136H882V264H786V104H690V296H594V200H498V104H402V232H306V136H210V296H114V168H82"/></g>
</g>

<!-- Scene 3: another grid-cell arrangement -->
<g class="scene s3">
 <path class="trail" d="M914 200H850V104H754V296H658V168H562V264H466V104H370V200H274V296H178V136H82"/>
 <g transform="translate(850 104)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#a78bfa" class="cell"/><text y="5" text-anchor="middle" class="letter">V</text></g><g transform="translate(754 296)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#60a5fa" class="cell"/><text y="5" text-anchor="middle" class="letter">T</text></g><g transform="translate(658 168)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f59e0b" class="cell"/><text y="5" text-anchor="middle" class="letter">M</text></g><g transform="translate(466 104)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#f472b6" class="cell"/><text y="5" text-anchor="middle" class="letter">Q</text></g><g transform="translate(274 296)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#fb7185" class="cell"/><text y="5" text-anchor="middle" class="letter">O</text></g><g transform="translate(178 136)"><rect x="-13.5" y="-13.5" width="27" height="27" rx="4" fill="#34d399" class="cell"/><text y="5" text-anchor="middle" class="letter">S</text></g>
 <g><path d="M-36 0H8" class="snakeBody"/><rect x="8" y="-9" width="18" height="18" rx="5" fill="#f0f6fc"/><circle cx="20" cy="-3" r="2" fill="#0d1117"/><animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M914 200H850V104H754V296H658V168H562V264H466V104H370V200H274V296H178V136H82"/></g>
</g>

<!-- Fixed map key -->
<rect x="34" y="350" width="928" height="56" rx="10" fill="#0d1117" stroke="#30363d"/><text x="50" y="371" class="sub">LEGEND / PROJECT KEY</text>
<g transform="translate(50 388)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#a78bfa"/><text x="9" y="3" text-anchor="middle" class="letter">V</text><text x="25" y="3" class="legend">Velocity Rush</text></g>
<g transform="translate(190 388)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#60a5fa"/><text x="9" y="3" text-anchor="middle" class="letter">T</text><text x="25" y="3" class="legend">Tune Protect</text></g>
<g transform="translate(330 388)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#f59e0b"/><text x="9" y="3" text-anchor="middle" class="letter">M</text><text x="25" y="3" class="legend">Museum VR</text></g>
<g transform="translate(465 388)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#f472b6"/><text x="9" y="3" text-anchor="middle" class="letter">Q</text><text x="25" y="3" class="legend">Quest</text></g>
<g transform="translate(585 388)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#fb7185"/><text x="9" y="3" text-anchor="middle" class="letter">O</text><text x="25" y="3" class="legend">VR Offshore</text></g>
<g transform="translate(735 388)"><rect x="0" y="-11" width="18" height="18" rx="3" fill="#34d399"/><text x="9" y="3" text-anchor="middle" class="letter">S</text><text x="25" y="3" class="legend">SciLab VR · Latest</text></g>
</svg>